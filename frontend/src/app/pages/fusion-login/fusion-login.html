@defer {
  <main class="card" animate.enter="fade-in" [class.loading]="loading()">
    <section class="panel-left">
      <header class="hero-title">
        <h1>Portal de aplicaciones remotas</h1>
        <p>Acceso remoto a las aplicaciones institucionales virtualizadas.</p>
      </header>

      <form class="form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <h2>Inicio de sesión</h2>

        <div class="field">
          <label for="username">Usuario</label>
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="Usuario institucional"
            autocomplete="username"
          />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password-field">
            <input
              id="password"
              [type]="hidePassword() ? 'password' : 'text'"
              formControlName="password"
              placeholder="Ingrese su contraseña"
              autocomplete="off"
            />
            <button class="toggle-password" type="button" (click)="togglePassword()">
              @if (hidePassword()) {
                <svg class="icon-eye" viewBox="0 0 24 24">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" />
                  <circle cx="12" cy="12" r="3.2" />
                </svg>
              } @else {
                <svg class="icon-eye" viewBox="0 0 24 24">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" />
                  <circle cx="12" cy="12" r="3.2" />
                  <path d="M4 4l16 16" />
                </svg>
              }
            </button>
          </div>
        </div>

        <button class="btn-submit" type="submit" [disabled]="loading()">
          <span>Ingresar</span>
        </button>

        @if (errorMessage()) {
          <p class="error-message" animate.enter="fade-in">{{ errorMessage() }}</p>
        }
      </form>
    </section>

    <section class="panel-right">
      <img src="logo_sv_animado.svg" alt="Gobierno de El Salvador" class="logo" />

      <div class="notice">
        <h2>Bienvenido</h2>
        <p>Inicia sesión con las credenciales de tu usuario institucional.</p>
      </div>

      <footer class="support">
        <strong>DINAFI-USC</strong>
      </footer>
    </section>
  </main>
} @placeholder (minimum 500ms) {
  <div class="preloader" >
    <img src="loading-bar.svg" alt="Cargando" />
  </div>
}
